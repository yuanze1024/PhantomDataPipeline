[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-data"
version = "0.1.0"
description = "Browse Phantom-Data annotations aligned to Koala videos on Baidu BOS (online, no download)"
requires-python = ">=3.10"
dependencies = ["pyarrow>=14", "numpy>=1.24"]

[project.optional-dependencies]
viewer = ["streamlit>=1.30", "decord>=0.6", "Pillow>=9.5", "bce-python-sdk>=0.8"]
# Runtime deps of the build pipeline (stages A-D). Two things are deliberately absent:
# SAM2 (stage C imports `sam2`, which is consumed from a source checkout on PYTHONPATH,
# not from an index) and ultravid_pipeline (stage C/D import it the same way).
build = [
    "decord>=0.6",
    "bce-python-sdk>=0.8",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    "Pillow>=9.5",
    "transformers>=4.40",
    "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
